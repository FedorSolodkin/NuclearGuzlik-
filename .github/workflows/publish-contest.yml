name: Publish exact offline contest APK
on:
  push:
    branches: [codex/publish-contest-offline-4-0-8]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore the already signed APK and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_contest_apk.py
